name: Final upstream diff cleanup

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/final-diff-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Clean upstream diff
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/Bithack/principia.git || true
          git fetch upstream master

          python3 <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"cleanup pattern not found in {path}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          # Restore two upstream blank lines that were accidentally lost.
          replace_once(
              "src/network_curl.cc",
              "            curl_easy_getinfo(P.curl, CURLINFO_RESPONSE_CODE, &http_code);\n            if (http_code == 404) {",
              "            curl_easy_getinfo(P.curl, CURLINFO_RESPONSE_CODE, &http_code);\n\n            if (http_code == 404) {",
          )

          replace_once(
              "src/tms/backend/main.cc",
              "    // we need to keep track of them and allocate in slots that fit TMS' pointer ID system.\n    for (int x = 0; x < MAX_P; x++) {",
              "    // we need to keep track of them and allocate in slots that fit TMS' pointer ID system.\n\n    for (int x = 0; x < MAX_P; x++) {",
          )

          # Keep texture.c's original upstream `else return 1;` line untouched.
          # The iOS recovery is inserted before the upstream lazy-load block instead.
          texture = Path("src/tms/core/texture.c")
          text = texture.read_text()

          old_else = '''        } else {
          #ifdef SDL_PLATFORM_IOS
                      if (tex->filename &&
                          strcmp(tex->filename, "mem") != 0) {
          
                          char *filename = strdup(tex->filename);
          
                          if (tms_texture_load(tex, filename) == T_OK) {
                              tms_texture_upload(tex);
                          }
          
                          free(filename);
                      } else {
                          return 1;
                      }
          #else
                      return 1;
          #endif
                  }'''.replace("          #", "#").replace("                      ", "            ").replace("                  }", "        }")

          if old_else not in text:
              raise SystemExit("texture.c iOS lazy-load replacement block not found")
          text = text.replace(old_else, "        } else return 1;", 1)

          marker = '''        tex->is_uploaded = 0;
                  tex->gl_texture = 0;
              }
          #endif
          
              if (!tex->is_uploaded && !tex->is_buffered) {'''.replace("                  ", "        ").replace("              }", "    }").replace("          #", "#").replace("          \n", "\n").replace("              if", "    if")

          insertion = '''        tex->is_uploaded = 0;
                  tex->gl_texture = 0;
              }
          #endif
          
          #ifdef SDL_PLATFORM_IOS
              if (!tex->is_uploaded && !tex->is_buffered && !tex->buffer_fn &&
                  tex->filename && strcmp(tex->filename, "mem") != 0) {
                  char *filename = strdup(tex->filename);
          
                  if (tms_texture_load(tex, filename) == T_OK)
                      tms_texture_upload(tex);
          
                  free(filename);
              }
          #endif
          
              if (!tex->is_uploaded && !tex->is_buffered) {'''.replace("                  ", "        ").replace("              }", "    }").replace("          #", "#").replace("          \n", "\n").replace("              if", "    if")

          if marker not in text:
              raise SystemExit("texture.c iOS recovery insertion point not found")
          texture.write_text(text.replace(marker, insertion, 1))

          # Remove this one-shot workflow from the final tree.
          Path(".github/workflows/final-diff-cleanup.yml").unlink()

          # Match upstream EOF/newline state on every shared file in the diff.
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", "upstream/master"], text=True
          ).splitlines()

          for path in changed:
              p = Path(path)
              if not p.is_file():
                  continue
              try:
                  upstream = subprocess.check_output(["git", "show", f"upstream/master:{path}"])
              except subprocess.CalledProcessError:
                  continue
              current = p.read_bytes()
              if b"\0" in upstream or b"\0" in current:
                  continue
              upstream_nl = len(upstream) - len(upstream.rstrip(b"\n"))
              current_nl = len(current) - len(current.rstrip(b"\n"))
              if upstream_nl != current_nl:
                  p.write_bytes(current.rstrip(b"\n") + (b"\n" * upstream_nl))

          # Enforce the rule: every remaining subtraction must be an intentional
          # iOS/platform-definition replacement. No whitespace/cleanup deletions.
          allowed = {
              "if(USE_GLES OR ANDROID OR EMSCRIPTEN OR NINTENDO_SWITCH)",
              "if(SHOULD_USE_GLES)",
              "    glBindFramebuffer(GL_FRAMEBUFFER, viewFramebuffer);",
              "#ifdef SDL_PLATFORM_ANDROID",
              "#if defined(SDL_PLATFORM_ANDROID) || defined(SDL_PLATFORM_SWITCH)",
              "#ifdef SDL_PLATFORM_WINDOWS",
              "\t// todo",
              "\t#error \"NYI\"",
          }

          diff = subprocess.check_output(
              ["git", "diff", "--no-color", "upstream/master"], text=True
          )
          bad = []
          deletions = []
          for line in diff.splitlines():
              if line.startswith("--- "):
                  continue
              if line.startswith("-"):
                  payload = line[1:]
                  deletions.append(payload)
                  if payload not in allowed:
                      bad.append(payload)

          print("Remaining subtraction lines:")
          for line in deletions:
              print(f"  - {line!r}")

          if bad:
              print("Unexpected subtraction lines remain:", file=sys.stderr)
              for line in bad:
                  print(f"  - {line!r}", file=sys.stderr)
              raise SystemExit(1)
          PY

          git config user.name "NyerahMT"
          git config user.email "68287092+NyerahMT@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Final upstream diff cleanup"
          git push origin HEAD:master
