name: iOS Release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Optional successful iOS workflow run ID (blank = latest successful master run)'
        required: false
        type: string

permissions:
  contents: read
  actions: read

env:
  BUNDLE_ID: com.nyerahmt.principia.ios
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  release:
    name: Sign and upload iOS build
    runs-on: macos-26

    env:
      APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
      APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
      APPLE_APPSTORE_PROFILE_BASE64: ${{ secrets.APPLE_APPSTORE_PROFILE_BASE64 }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_P8_BASE64 }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout Principia
        uses: actions/checkout@v6

      - name: Verify Xcode toolchain
        run: |
          set -euo pipefail
          XCODE_VERSION="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          xcodebuild -version
          echo "Using iPhoneOS SDK $SDK_VERSION"
          test "$XCODE_VERSION" = "26.6"
          case "$SDK_VERSION" in
            26.*) ;;
            *) echo "Expected an iOS 26.x SDK, got $SDK_VERSION" >&2; exit 1 ;;
          esac

      - name: Check release secrets
        run: |
          set -euo pipefail
          required=(
            APPLE_DISTRIBUTION_P12_BASE64
            APPLE_DISTRIBUTION_P12_PASSWORD
            APPLE_APPSTORE_PROFILE_BASE64
            APP_STORE_CONNECT_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_P8_BASE64
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Download unsigned Principia IPA
        run: |
          set -euo pipefail
          RUN_ID='${{ inputs.source_run_id }}'
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow iOS.yml \
              --branch master \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi
          test -n "$RUN_ID"
          echo "Using iOS workflow run $RUN_ID"
          rm -rf unsigned
          mkdir -p unsigned
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name principia-ios \
            --dir unsigned
          test -f unsigned/Principia.ipa

      - name: Install distribution certificate
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/apple-distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/principia-release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)$(uuidgen)"

          printf '%s' "$APPLE_DISTRIBUTION_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DISTRIBUTION_P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -nE 's/.*"(Apple Distribution:[^"]+)".*/\1/p' | head -1)"
          test -n "$IDENTITY"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Prepare App Store provisioning profile
        run: |
          set -euo pipefail
          PROFILE_PATH="$RUNNER_TEMP/appstore.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/appstore-profile.plist"
          ENTITLEMENTS="$RUNNER_TEMP/appstore-entitlements.plist"

          printf '%s' "$APPLE_APPSTORE_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$PROFILE_PLIST" > "$ENTITLEMENTS"

          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$PROFILE_PLIST")"
          PROFILE_BUNDLE_ID="${PROFILE_APP_ID#*.}"
          if [ "$PROFILE_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "Provisioning profile is for $PROFILE_BUNDLE_ID, expected $BUNDLE_ID" >&2
            exit 1
          fi

          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          echo "Using provisioning profile: $PROFILE_NAME"
          echo "PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"
          echo "SIGNING_ENTITLEMENTS=$ENTITLEMENTS" >> "$GITHUB_ENV"

      - name: Sign Principia IPA
        run: |
          set -euo pipefail
          rm -rf signed-root signed
          mkdir -p signed-root signed
          unzip -q unsigned/Principia.ipa -d signed-root

          APP="$(find signed-root/Payload -maxdepth 1 -type d -name '*.app' | head -1)"
          test -d "$APP"

          PLIST="$APP/Info.plist"
          ACTUAL_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          if [ "$ACTUAL_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "IPA bundle ID is $ACTUAL_BUNDLE_ID, expected $BUNDLE_ID" >&2
            exit 1
          fi

          # App Store builds made with current SDKs require app icons to come
          # from a compiled asset catalog and CFBundleIconName to identify it.
          SRC="$GITHUB_WORKSPACE/packaging/principia.png"
          ASSET_CATALOG="$RUNNER_TEMP/PrincipiaAssets.xcassets"
          APP_ICON_SET="$ASSET_CATALOG/AppIcon.appiconset"
          PARTIAL_PLIST="$RUNNER_TEMP/appicon-partial.plist"
          test -f "$SRC"
          rm -rf "$ASSET_CATALOG" "$PARTIAL_PLIST"
          mkdir -p "$APP_ICON_SET"

          # The upstream icon PNG carries an alpha channel. App Store icons
          # must be fully opaque, so round-trip through JPEG before producing
          # the PNG sizes used by the asset catalog.
          OPAQUE_SRC="$RUNNER_TEMP/principia-app-icon.jpg"
          sips -s format jpeg -s formatOptions best "$SRC" --out "$OPAQUE_SRC" >/dev/null
          test -f "$OPAQUE_SRC"

          make_icon() {
            local size="$1"
            local name="$2"
            sips -s format png -z "$size" "$size" "$OPAQUE_SRC" --out "$APP_ICON_SET/$name" >/dev/null
          }

          make_icon 40   icon-20@2x.png
          make_icon 60   icon-20@3x.png
          make_icon 58   icon-29@2x.png
          make_icon 87   icon-29@3x.png
          make_icon 80   icon-40@2x.png
          make_icon 120  icon-40@3x.png
          make_icon 120  icon-60@2x.png
          make_icon 180  icon-60@3x.png
          make_icon 20   icon-20-ipad.png
          make_icon 40   icon-20@2x-ipad.png
          make_icon 29   icon-29-ipad.png
          make_icon 58   icon-29@2x-ipad.png
          make_icon 40   icon-40-ipad.png
          make_icon 80   icon-40@2x-ipad.png
          make_icon 76   icon-76-ipad.png
          make_icon 152  icon-76@2x-ipad.png
          make_icon 167  icon-83.5@2x-ipad.png
          make_icon 1024 icon-marketing.png

          cat > "$APP_ICON_SET/Contents.json" <<'JSON'
          {
            "images" : [
              { "filename" : "icon-20@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "20x20" },
              { "filename" : "icon-20@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "20x20" },
              { "filename" : "icon-29@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "29x29" },
              { "filename" : "icon-29@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "29x29" },
              { "filename" : "icon-40@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "40x40" },
              { "filename" : "icon-40@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "40x40" },
              { "filename" : "icon-60@2x.png", "idiom" : "iphone", "scale" : "2x", "size" : "60x60" },
              { "filename" : "icon-60@3x.png", "idiom" : "iphone", "scale" : "3x", "size" : "60x60" },
              { "filename" : "icon-20-ipad.png", "idiom" : "ipad", "scale" : "1x", "size" : "20x20" },
              { "filename" : "icon-20@2x-ipad.png", "idiom" : "ipad", "scale" : "2x", "size" : "20x20" },
              { "filename" : "icon-29-ipad.png", "idiom" : "ipad", "scale" : "1x", "size" : "29x29" },
              { "filename" : "icon-29@2x-ipad.png", "idiom" : "ipad", "scale" : "2x", "size" : "29x29" },
              { "filename" : "icon-40-ipad.png", "idiom" : "ipad", "scale" : "1x", "size" : "40x40" },
              { "filename" : "icon-40@2x-ipad.png", "idiom" : "ipad", "scale" : "2x", "size" : "40x40" },
              { "filename" : "icon-76-ipad.png", "idiom" : "ipad", "scale" : "1x", "size" : "76x76" },
              { "filename" : "icon-76@2x-ipad.png", "idiom" : "ipad", "scale" : "2x", "size" : "76x76" },
              { "filename" : "icon-83.5@2x-ipad.png", "idiom" : "ipad", "scale" : "2x", "size" : "83.5x83.5" },
              { "filename" : "icon-marketing.png", "idiom" : "ios-marketing", "scale" : "1x", "size" : "1024x1024" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON

          xcrun actool "$ASSET_CATALOG" \
            --compile "$APP" \
            --platform iphoneos \
            --minimum-deployment-target 15.0 \
            --app-icon AppIcon \
            --target-device iphone \
            --target-device ipad \
            --output-partial-info-plist "$PARTIAL_PLIST"

          test -f "$APP/Assets.car"
          test -f "$PARTIAL_PLIST"

          /usr/libexec/PlistBuddy -c 'Delete :CFBundleIcons' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Delete :CFBundleIcons~ipad' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Delete :CFBundleIconName' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Merge $PARTIAL_PLIST" "$PLIST"
          if /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Set :CFBundleIconName AppIcon' "$PLIST"
          else
            /usr/libexec/PlistBuddy -c 'Add :CFBundleIconName string AppIcon' "$PLIST"
          fi
          plutil -lint "$PLIST"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$PLIST")" = "AppIcon"

          cp "$PROFILE_PATH" "$APP/embedded.mobileprovision"

          if [ -d "$APP/Frameworks" ]; then
            while IFS= read -r -d '' item; do
              codesign --force --sign "$SIGNING_IDENTITY" --generate-entitlement-der "$item"
            done < <(find "$APP/Frameworks" \( -type d -name '*.framework' -o -type f -name '*.dylib' \) -print0)
          fi

          if [ -d "$APP/PlugIns" ]; then
            while IFS= read -r -d '' item; do
              codesign --force --sign "$SIGNING_IDENTITY" --generate-entitlement-der "$item"
            done < <(find "$APP/PlugIns" -type d -name '*.appex' -print0)
          fi

          codesign \
            --force \
            --sign "$SIGNING_IDENTITY" \
            --entitlements "$SIGNING_ENTITLEMENTS" \
            --generate-entitlement-der \
            "$APP"

          codesign --verify --deep --strict --verbose=2 "$APP"

          (cd signed-root && /usr/bin/zip -qry "$GITHUB_WORKSPACE/signed/Principia.ipa" Payload)
          test -f signed/Principia.ipa

      - name: Configure App Store Connect API key
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APP_STORE_CONNECT_P8_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          test -s "$KEY_PATH"
          echo "APP_STORE_CONNECT_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Validate with App Store Connect
        run: |
          set -euo pipefail
          xcrun altool \
            --validate-app \
            --file signed/Principia.ipa \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload to App Store Connect
        run: |
          set -euo pipefail
          xcrun altool \
            --upload-app \
            --file signed/Principia.ipa \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: principia-ios-signed
          path: signed/Principia.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Clean signing material
        if: always()
        run: |
          set +e
          if [ -n "${SIGNING_KEYCHAIN:-}" ] && [ -f "$SIGNING_KEYCHAIN" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN"
          fi
          rm -f \
            "$RUNNER_TEMP/apple-distribution.p12" \
            "$RUNNER_TEMP/appstore.mobileprovision" \
            "$RUNNER_TEMP/appstore-profile.plist" \
            "$RUNNER_TEMP/appstore-entitlements.plist" \
            "$RUNNER_TEMP/appicon-partial.plist" \
            "$RUNNER_TEMP/principia-app-icon.jpg" \
            "${APP_STORE_CONNECT_KEY_PATH:-}"