name: Trigger Release Build 45

on:
  push:
    paths:
      - '.github/workflows/trigger-release-build45.yml'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch iOS release for build 45
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run iOS-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref master \
            -f source_run_id=33729233070
